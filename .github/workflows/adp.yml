# ADP checks. Each job runs one script from scripts/; the same script
# runs locally. Job names are the required status checks in adp-ruleset.
name: adp

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: sh scripts/hooks/test
      # A Dependabot pull request has no ADP anchor; commit-check.yml checks
      # it under ENG-DEC-021 instead.
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: sh scripts/ci/check-commits "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema==4.26.0 pyyaml==6.0.3
      - run: python scripts/ci/check_schema.py
      - run: python scripts/ci/check_conformance.py
      - run: sh scripts/ci/check-schema-gate "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  defects:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: sh scripts/ci/test python
      - run: python scripts/ci/check_defects.py "${{ github.event.pull_request.base.sha }}"

  implementation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: impl/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: rustup override set 1.99.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --locked   # MSRV, ADP-A-008 C2.1(e)
