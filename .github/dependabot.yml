# Automated update proposals (eng-principles ENG-STD-008 `dependabot`).
# Updates arrive as pull requests. They change pinned actions or the crate's
# dependencies, so they are security-related (ADP-0 §8.1) and the maintainer
# merges them.
#
# Commit subjects come out as `chore(deps): bump <name> from <a> to <b>`,
# the version-bump shape the shared eng-principles commit check exempts from
# needing an anchor (ENG-DEC-021).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: cargo
    directory: /impl/rust
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
